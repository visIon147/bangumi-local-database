{% extends "base.html" %}
{% block content %}
{% include "steam/_nav.html" %}
<div class="page-heading"><div><p class="eyebrow">Local mirror</p><h1>Steam 分类</h1></div><span class="count">{{ items|length }}</span></div>
<form class="filters" method="get"><label>排序<select name="sort"><option value="name-asc"{% if sort == 'name-asc' %} selected{% endif %}>名称 A→Z</option><option value="name-desc"{% if sort == 'name-desc' %} selected{% endif %}>名称 Z→A</option><option value="count-desc"{% if sort == 'count-desc' %} selected{% endif %}>条目数 多→少</option><option value="count-asc"{% if sort == 'count-asc' %} selected{% endif %}>条目数 少→多</option></select></label><button>排序</button></form>
<div class="table-wrap"><table>
  <thead><tr><th>名称</th><th>类型</th><th>状态</th><th>条目</th></tr></thead>
  <tbody>{% for item in items %}<tr><td><a href="/steam/library?collection={{ item.name|urlencode }}">{{ item.name }}</a></td><td>{{ item.kind }}</td><td>{{ "active" if item.active else "inactive" }}</td><td>{{ item.active_entries }}</td></tr>{% else %}<tr><td colspan="4" class="empty">尚无分类</td></tr>{% endfor %}</tbody>
</table></div>
{% endblock %}
